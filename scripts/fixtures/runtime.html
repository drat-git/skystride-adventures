<!doctype html><html><head><style>body{margin:0;background:#172038;color:white;font-family:monospace}#game{width:800px;height:450px;margin:0}canvas{image-rendering:pixelated}input{margin:20px}pre{white-space:pre-wrap}</style></head><body><div id="game"></div><button id="resume-run" onclick="window.current.scene.resumeAfterDeath()">Resume run</button><button id="toolbar-button">Toolbar action</button><input id="metadata" aria-label="Metadata"><pre id="hud"></pre><script type="module">
import { mountGame } from '/src/game.ts';
import { officialCourses } from '/src/content/official.ts';
const base={version:2,cols:64,rows:25,theme:'overworld',timeLimit:150,start:{x:3,y:22},finish:{x:60,y:22},finishHeight:9,terrain:[{x:0,y:23,width:64},{x:0,y:24,width:64}],platforms:[],blocks:[],items:[],powerups:[],hazards:[],checkpoints:[],enemies:[],movingPlatforms:[],obstacles:[],decorations:[]};
window.results=[]; window.states=[]; window.current=null;
window.mountFixture=(changes={})=>{ window.current?.destroy(); document.querySelector('#game').replaceChildren(); window.results=[]; window.states=[]; const level={id:'fixture',title:'Runtime fixture',description:'',difficulty:'easy',layout:{...structuredClone(base),...changes}}; window.current=mountGame(document.querySelector('#game'),level,result=>window.results.push(result),{onState:s=>window.states.push(s),onHud:h=>document.querySelector('#hud').textContent=JSON.stringify(h)}); };
window.mountOfficial=(index)=>{window.current?.destroy();document.querySelector('#game').replaceChildren();window.results=[];window.states=[];window.current=mountGame(document.querySelector('#game'),officialCourses[index],r=>window.results.push(r),{onState:s=>window.states.push(s),onHud:h=>document.querySelector('#hud').textContent=JSON.stringify(h)});};
window.mountFixture();
</script></body></html>
